<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waypoint</title>

<style>
:root{
  --bg:#0f1115;
  --panel:#171a21;
  --muted:#aab1c7;
  --text:#e6e8ef;
  --brand:#7aa2ff;
  --accent:#66e0a3;
  --music:#ffb86b;
  --br:16px;
  --shadow:0 8px 24px rgba(0,0,0,.28);
}

*{ box-sizing:border-box }
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
}

.wrap{
  max-width:1000px;
  margin:32px auto;
  padding:16px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.title{ font-size:24px; font-weight:800 }
.sub{ color:var(--muted); font-size:14px }

.panel{
  background:var(--panel);
  border-radius:var(--br);
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}

.chooser{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.btn{
  border:0;
  padding:12px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  font-size:15px;
}

.b-dark{ background:#222; color:var(--text) }
.b-brand{ background:var(--brand); color:#000 }
.b-accent{ background:var(--accent); color:#000 }
.b-music{ background:var(--music); color:#000 }

.shelf{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.tile{
  background:#1b202a;
  padding:14px;
  border-radius:14px;
}

.tile h3{
  margin:0 0 8px;
  font-size:15px;
  color:var(--muted);
  font-weight:600;
}

.tile ul{
  margin:0;
  padding-left:18px;
  line-height:1.9;
}

.tile a{
  color:var(--text);
  text-decoration:none;
  font-weight:600;
}

.tile a:hover{
  color:var(--brand);
}

.clock{
  font-variant-numeric:tabular-nums;
  padding:6px 12px;
  background:#1b202a;
  border-radius:10px;
  font-size:15px;
}

.tab{ display:none }
.tab.active{ display:block }

.error{
  color:#ff6b6b;
  padding:16px;
  text-align:center;
}
</style>
</head>

<body>
<div class="wrap">

  <header>
    <div>
      <div class="title">Waypoint</div>
      <div class="sub">Your daily starting point</div>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <section class="panel">
    <div class="chooser" id="tab-buttons"></div>
  </section>

  <section class="panel" id="tab-content">
    <div class="tab active" style="text-align:center;color:var(--muted);padding:24px">Loading...</div>
  </section>

</div>

<script>
async function init() {
  try {
    const res = await fetch('links.json');
    if (!res.ok) throw new Error('Could not load links.json');
    const data = await res.json();
    buildTabs(data.tabs);
    showTab(data.tabs[0].id);
  } catch (e) {
    document.getElementById('tab-content').innerHTML =
      '<div class="error">Could not load links. Make sure links.json is in the same folder.</div>';
  }
}

function buildTabs(tabs) {
  const buttons = document.getElementById('tab-buttons');
  const content = document.getElementById('tab-content');

  buttons.innerHTML = '';
  content.innerHTML = '';

  tabs.forEach(tab => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + tab.style;
    btn.textContent = tab.label;
    btn.onclick = () => showTab(tab.id);
    buttons.appendChild(btn);

    const panel = document.createElement('div');
    panel.id = tab.id;
    panel.className = 'tab';

    const shelf = document.createElement('div');
    shelf.className = 'shelf';

    tab.sections.forEach(section => {
      const tile = document.createElement('div');
      tile.className = 'tile';

      const h3 = document.createElement('h3');
      h3.textContent = section.title;
      tile.appendChild(h3);

      const ul = document.createElement('ul');
      section.links.forEach(link => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = link.href;
        a.textContent = link.label;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        li.appendChild(a);
        ul.appendChild(li);
      });
      tile.appendChild(ul);
      shelf.appendChild(tile);
    });

    panel.appendChild(shelf);
    content.appendChild(panel);
  });
}

function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function tick() {
  const d = new Date();
  document.getElementById('clock').textContent =
    d.getHours().toString().padStart(2,'0') + ':' +
    d.getMinutes().toString().padStart(2,'0');
}

setInterval(tick, 1000);
tick();
init();
</script>

</body>
</html>
